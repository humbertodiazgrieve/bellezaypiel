<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- Fondo cálido -->
  <rect width="600" height="800" fill="#f5ead8"/>
  <circle cx="480" cy="160" r="200" fill="#ebddc5" opacity="0.6"/>
  <circle cx="80" cy="680" r="160" fill="#e8d5b7" opacity="0.5"/>
  
  <!-- Sombra del producto -->
  <ellipse cx="300" cy="680" rx="140" ry="24" fill="#d4c4a8" opacity="0.4"/>
  
  <!-- Cuerpo del frasco (vidrio ámbar) -->
  <path d="M 180 320 L 180 600 Q 180 660 240 660 L 360 660 Q 420 660 420 600 L 420 320 Z" fill="#c67139" opacity="0.15"/>
  <path d="M 180 320 L 180 600 Q 180 660 240 660 L 360 660 Q 420 660 420 600 L 420 320 Z" fill="url(#glassGradient)"/>
  
  <!-- Líquido interior -->
  <path d="M 190 340 L 190 590 Q 190 640 240 640 L 360 640 Q 410 640 410 590 L 410 340 Z" fill="#f0e6d2" opacity="0.8"/>
  
  <!-- Cuello del frasco -->
  <rect x="260" y="280" width="80" height="60" fill="#e8dcc8"/>
  <rect x="260" y="280" width="80" height="60" fill="url(#neckGradient)"/>
  
  <!-- Tapón/dropper -->
  <ellipse cx="300" cy="280" rx="50" ry="16" fill="#8b6914"/>
  <rect x="250" y="240" width="100" height="50" rx="8" fill="#8b6914"/>
  <rect x="250" y="240" width="100" height="50" rx="8" fill="url(#capGradient)"/>
  
  <!-- Pipeta visible -->
  <rect x="290" y="180" width="20" height="70" rx="10" fill="#d4c4a8"/>
  <ellipse cx="300" cy="180" rx="10" ry="6" fill="#c4b498"/>
  
  <!-- Etiqueta -->
  <rect x="210" y="400" width="180" height="180" rx="4" fill="#f8f4ec"/>
  <rect x="210" y="400" width="180" height="180" rx="4" fill="url(#labelGradient)" opacity="0.9"/>
  
  <!-- Texto de etiqueta -->
  <text x="300" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#5a4a3a" text-anchor="middle">Sérum</text>
  <text x="300" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#7a6a5a" text-anchor="middle">Niacinamida 5%</text>
  <text x="300" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#9a8a7a" text-anchor="middle">+ Zinc PCA</text>
  
  <!-- Líneas decorativas de etiqueta -->
  <line x1="230" y1="530" x2="370" y2="530" stroke="#d4c4a8" stroke-width="1"/>
  <text x="300" y="556" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#8a7a6a" text-anchor="middle">30 ml · e 1.0 fl.oz</text>
  
  <!-- Definiciones de gradientes -->
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8dcc8;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#f0e6d2;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#e0d0b8;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="neckGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4c4a8" />
      <stop offset="50%" style="stop-color:#e8dcc8" />
      <stop offset="100%" style="stop-color:#d0c0a0" />
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9a7914" />
      <stop offset="50%" style="stop-color:#b08a2a" />
      <stop offset="100%" style="stop-color:#8b6914" />
    </linearGradient>
    <linearGradient id="labelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#f0e8dc" />
    </linearGradient>
  </defs>
</svg>
